<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>bilibili-teen-up</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../icons/icon48.png" alt="">
    <div>
      <div class="name">青少年模式</div>
      <div class="sub">bilibili-teen-up</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="opts">
    <div class="opt">
      <div>
        <div class="opt-name">仅过滤黑名单</div>
        <div class="opt-desc">开启=只拦黑名单（黑词/黑UP/黑分区/直播），其余全部放行；关闭=严格白名单档（未命中白名单的内容隐藏）</div>
      </div>
      <label class="switch sm">
        <input type="checkbox" id="blackOnly">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <section class="blocked">
    <div class="sec-head">
      <span>最近屏蔽</span>
      <a href="#" id="openOptions">配置页 →</a>
    </div>
    <ul id="blockedList" class="blocked-list">
      <li class="empty">暂无记录</li>
    </ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
